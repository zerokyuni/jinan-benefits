                            <span className="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md text-xs font-bold">{filteredPolicies.length}건</span>
                        </div>

                        {filteredPolicies.length > 0 ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                {filteredPolicies.map((policy, index) => (
                                    <div key={index} onClick={() => setSelectedPolicy(policy)}
                                        className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:shadow-xl hover:border-emerald-400 hover:-translate-y-1 transition-all cursor-pointer group flex flex-col h-full animate-fade-in" style={{animationDelay: `${index * 30}ms`}}>
                                        <div className="flex justify-between items-start mb-3">
                                            <span className={`px-2.5 py-1 text-[11px] font-bold rounded-md tracking-wide 
                                                ${policy.category.includes('농업') ? 'bg-orange-100 text-orange-700' : 
                                                  policy.category.includes('원예') ? 'bg-green-100 text-green-700' : 
                                                  policy.category.includes('축산') ? 'bg-amber-100 text-amber-700' : 
                                                  policy.category === '청년' ? 'bg-blue-100 text-blue-700' : 
                                                  'bg-emerald-100 text-emerald-800'}`}>
                                                {policy.category}
                                            </span>
                                            <ChevronRight className="text-gray-300 group-hover:text-emerald-500 transition-colors" size={18} />
                                        </div>
                                        <h3 className="text-lg font-bold text-gray-800 mb-2 leading-snug group-hover:text-emerald-700">{policy.title}</h3>
                                        <div className="flex items-center gap-1.5 mb-3 bg-gray-50 px-2 py-1.5 rounded-lg border border-gray-100">
                                            <CheckCircle size={13} className="text-emerald-500 flex-shrink-0" />
                                            <span className="text-xs font-medium text-gray-600 truncate">{policy.target}</span>
                                        </div>
                                        <p className="text-sm text-gray-500 line-clamp-2 mb-4 flex-grow">{policy.desc}</p>
                                        <div className="pt-3 border-t border-gray-50 flex justify-between items-center text-xs">
                                            <span className="font-semibold text-gray-400">{policy.department}</span>
                                            <span className="text-emerald-600 font-bold flex items-center gap-1">상세보기 <div className="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div></span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="text-center py-20 bg-white rounded-2xl border border-dashed border-gray-300">
                                <Search className="mx-auto text-gray-300 mb-3" size={40} />
                                <p className="text-gray-500 font-bold">검색 결과가 없습니다.</p>
                                <p className="text-gray-400 text-sm mt-1">다른 키워드로 검색해보세요.</p>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-800 text-slate-400 py-10 text-sm border-t border-slate-700">
                        <div className="max-w-6xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8 text-center md:text-left">
                            <div>
                                <h3 className="text-white font-bold text-base mb-3 flex items-center justify-center md:justify-start gap-2"><Phone size={16}/> 주요 민원처</h3>
                                <ul className="space-y-1.5">
                                    <li>농업정책과 (농정기획) <span className="text-slate-500">|</span> 063-430-8652</li>
                                    <li>농촌활력과 (귀농귀촌) <span className="text-slate-500">|</span> 063-430-8072</li>
                                    <li>인구활력팀 (총괄문의) <span className="text-slate-500">|</span> 063-430-2837</li>
                                </ul>
                            </div>
                            <div className="md:col-span-2">
                                <p className="leading-relaxed">
                                    본 서비스는 진안군 2026년도 농림축산식품분야 주요 지원사업 및 인구정책을 기반으로 요약된 정보입니다.<br/>
                                    <span className="text-orange-400">정책별 예산 소진 및 시기에 따라 지원 내용이 변경될 수 있으므로, 반드시 담당 부서에 전화 문의 후 신청하시기 바랍니다.</span>
                                </p>
                                <p className="mt-4 text-xs text-slate-600">Copyright © Jinan-gun Policy Navigator. All rights reserved.  BY KYUN </p>
                            </div>
                        </div>
                    </footer>

                    {/* Modal */}
                    {selectedPolicy && (
                        <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black/60 backdrop-blur-sm p-0 md:p-4 animate-fade-in" onClick={() => setSelectedPolicy(null)}>
                            <div className="bg-white w-full max-w-lg md:rounded-2xl rounded-t-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col" onClick={e => e.stopPropagation()}>
                                <div className="bg-emerald-700 p-6 text-white shrink-0 relative">
                                    <button onClick={() => setSelectedPolicy(null)} className="absolute top-4 right-4 text-white/70 hover:text-white"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                                    <span className="inline-block px-2 py-0.5 bg-black/20 text-[11px] font-bold rounded mb-2 border border-white/10">{selectedPolicy.category}</span>
                                    <h3 className="text-2xl font-bold leading-tight mb-2">{selectedPolicy.title}</h3>
                                    <div className="flex items-center gap-2 text-emerald-100 text-sm font-medium"><Users size={14}/> 대상: {selectedPolicy.target}</div>
                                </div>
                                <div className="p-6 overflow-y-auto">
                                    <h4 className="flex items-center gap-2 text-sm font-bold text-gray-500 uppercase tracking-wider mb-3"><Info size={16}/> 지원 내용</h4>
                                    <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-100 mb-6 text-gray-800 font-bold text-lg leading-relaxed">{selectedPolicy.desc}</div>
                                    
                                    {selectedPolicy.detailCriteria && (
                                        <div className="mb-6">
                                            <h4 className="flex items-center gap-2 text-sm font-bold text-gray-500 uppercase tracking-wider mb-3"><CheckCircle size={16}/> 상세 기준</h4>
                                            <ul className="space-y-2">
                                                {selectedPolicy.detailCriteria.map((item, idx) => (
                                                    <li key={idx} className="flex gap-3 text-sm text-gray-700 bg-gray-50 p-3 rounded-lg"><div className="mt-1.5 w-1.5 h-1.5 bg-emerald-500 rounded-full shrink-0"></div>{item}</li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                    
                                    <div className="mt-auto pt-4 border-t border-gray-100 flex items-center justify-between">
                                        <div><p className="text-xs text-gray-400 font-bold mb-0.5">담당부서</p><p className="font-bold text-gray-800">{selectedPolicy.department}</p></div>
                                        <a href={`tel:${selectedPolicy.contact}`} className="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl font-bold transition-colors shadow-lg shadow-emerald-200"><Phone size={18}/> 전화문의</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
